<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Relatórios - Engenharia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; font-family: 'Poppins', sans-serif; background: #f0f2f5; }
        .loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #667eea; display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3); border-top: 5px solid white; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px; display: none; }
        .modern-header { background: white; border-radius: 20px; padding: 15px 30px; margin-bottom: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo-area { display: flex; align-items: center; gap: 15px; flex:1;}
        .logo-area img { height: 155px; width: auto; object-fit: contain; }
        .logo-area h1 { font-size: 1.5rem; font-weight: 600; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .logo-area p { font-size: 0.8rem; color: #888; }
        .user-area { display: flex; align-items: center; gap: 20px; background: #f8f9fc; padding: 8px 20px; border-radius: 50px; flex-wrap: wrap; }
        .user-area span { font-weight: 500; color: #333; cursor: pointer; transition: color 0.3s; display: flex; align-items: center; gap: 6px; }
        .user-area span:hover { color: #667eea; }
        .main-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 30px; align-items: start; }
        .form-card, .report-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); transition: transform 0.3s, box-shadow 0.3s; }
        .form-card:hover, .report-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .card-title { font-size: 1.3rem; font-weight: 600; color: #333; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #eef2f7; display: flex; align-items: center; gap: 10px; }
        .card-title i { color: #667eea; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; font-size: 0.85rem; }
        .form-group label.required:after { content: " *"; color: #e74c3c; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 15px; border: 1px solid #e1e5eb; border-radius: 12px; font-size: 14px; font-family: 'Poppins', sans-serif; transition: all 0.3s; background: #f8f9fc; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; background: white; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { padding: 12px 24px; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.3s; border: none; font-family: 'Poppins', sans-serif; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .btn-secondary { background: #48bb78; color: white; }
        .btn-secondary:hover { background: #38a169; transform: translateY(-2px); }
        .btn-danger { background: #f56565; color: white; }
        .btn-danger:hover { background: #e53e3e; transform: translateY(-2px); }
        .btn-warning { background: #ed8936; color: white; }
        .btn-warning:hover { background: #dd6b20; transform: translateY(-2px); }
        .btn-outline { background: transparent; border: 1px solid #e1e5eb; color: #666; }
        .btn-outline:hover { background: #f8f9fc; border-color: #667eea; color: #667eea; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-small { padding: 5px 10px; font-size: 11px; margin: 2px; border-radius: 8px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-item { background: linear-gradient(135deg, #f8f9fc 0%, #ffffff 100%); padding: 10px 8px; border-radius: 12px; text-align: center; border: 1px solid #eef2f7; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        .stat-item h4 { font-size: 0.6rem; color: #888; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stat-item .value { font-size: 1.3rem; font-weight: 700; color: #667eea; line-height: 1.2; }
        .table-container { overflow-x: auto; margin-top: 20px; max-height: 600px; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #eef2f7; }
        th { background: #f8f9fc; color: #555; font-weight: 600; white-space: nowrap; position: sticky; top: 0; z-index: 10; }
        tr:hover { background: #f8f9fc; }
        .descricao-cell { 
            cursor: pointer; 
            max-width: 200px; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap;
            color: #667eea;
            font-weight: 500;
            transition: all 0.2s;
        }
        .descricao-cell:hover { 
            color: #764ba2;
            text-decoration: underline;
        }
        .filters-bar { background: #f8f9fc; padding: 20px; border-radius: 16px; margin-bottom: 20px; }
        .filters-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .filter-group { display: flex; flex-direction: column; }
        .filter-group label { font-size: 0.7rem; font-weight: 600; color: #888; margin-bottom: 5px; }
        .filter-group select, .filter-group input { padding: 10px; border: 1px solid #e1e5eb; border-radius: 10px; font-size: 0.8rem; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; border-radius: 24px; width: 600px; max-width: 90%; max-height: 85vh; overflow-y: auto; animation: modalFadeIn 0.3s; }
        .modal-large { width: 1000px; }
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .modal-header { padding: 20px 25px; border-bottom: 1px solid #eef2f7; display: flex; justify-content: space-between; align-items: center; position: relative; }
        .modal-header h2 { font-size: 1.3rem; font-weight: 600; text-align: center; flex: 1; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #999; position: absolute; left: 20px; top: 50%; transform: translateY(-50%); }
        .modal-close:hover { color: #333; }
        .modal-body { padding: 25px; }
        .modal-footer { padding: 15px 25px; border-top: 1px solid #eef2f7; display: flex; justify-content: flex-end; gap: 10px; }
        .login-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .login-card { background: white; border-radius: 30px; width: 450px; max-width: 90%; padding: 45px 40px; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.2); animation: fadeInUp 0.5s; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .login-card h2 { font-size: 2rem; font-weight: 600; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px; }
        .login-subtitle { color: #888; margin-bottom: 30px; font-size: 0.9rem; }
        .login-input { width: 100%; padding: 15px 20px; margin: 10px 0; border: 1px solid #e1e5eb; border-radius: 16px; font-size: 0.9rem; transition: all 0.3s; background: #f8f9fc; }
        .login-input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .login-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 16px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 20px; transition: transform 0.3s, box-shadow 0.3s; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(102,126,234,0.3); }
        .info-badge { background: #f0f4ff; padding: 15px; border-radius: 16px; margin-top: 25px; text-align: left; font-size: 0.75rem; color: #555; border-left: 4px solid #667eea; }
        .info-badge p { margin: 5px 0; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin: 15px 0; justify-content: flex-start; }
        .checkbox-group input { width: 16px; height: 16px; margin: 0; }
        .checkbox-group label { color: #666; font-size: 0.8rem; margin: 0; }
        .user-table { width: 100%; border-collapse: collapse; }
        .user-table th, .user-table td { padding: 12px; text-align: left; border-bottom: 1px solid #eef2f7; }
        .nome-usuario { cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 5px; }
        .nome-usuario:hover { color: #667eea; }
        .cpf-mask { font-family: monospace; letter-spacing: 1px; }
        
        .sync-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #c6f6d5;
            background: #f0fff4;
            color: #48bb78;
        }
        .sync-status.sync-error {
            color: #f56565;
            background: #fff5f5;
            border-color: #fed7d7;
        }
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
        .status-dot.online { background: #48bb78; }
        .status-dot.offline { background: #f56565; }
        .status-dot.syncing { background: #ed8936; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .btn-import { background: #4299e1; color: white; }
        .btn-import:hover { background: #3182ce; transform: translateY(-2px); }
        
        .descricao-detalhada {
            background: #f8f9fc;
            padding: 20px;
            border-radius: 12px;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.6;
            border-left: 4px solid #667eea;
        }

.dashboard-card {
    padding: 25px;
    display: flex;
    flex-direction: column;
}

.dashboard-card .card-title {
    font-size: 1.3rem;
    margin-bottom: 20px;
    padding-bottom: 10px;
}

.dashboard-card .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.dashboard-card .stat-item {
    background: linear-gradient(135deg, #f8f9fc 0%, #ffffff 100%);
    padding: 15px;
    border-radius: 16px;
    text-align: center;
    border: 1px solid #eef2f7;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
}

.dashboard-card .stat-item h4 {
    font-size: 0.75rem;
    color: #888;
    margin-bottom: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.dashboard-card .stat-item .value {
    font-size: 1.8rem;
    font-weight: 700;
    color: #667eea;
    line-height: 1.2;
}

.dashboard-card .btn {
    padding: 12px 24px;
    font-size: 14px;
    width: 100%;
    margin-top: auto;
}

.dashboard-card .btn i {
    font-size: 14px;
}
th.sortable {
    cursor: pointer;
    user-select: none;
    position: relative;
    padding-right: 20px;
    transition: background 0.2s;
}

th.sortable:hover {
    background: #e8ecf1;
}

th.sortable::after {
    content: ' ↕';
    font-size: 10px;
    color: #999;
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
}

th.sortable.asc::after {
    content: ' ▲';
    color: #667eea;
}

th.sortable.desc::after {
    content: ' ▼';
    color: #667eea;
}

        @media (max-width: 768px) {
            .main-layout { grid-template-columns: 1fr; }
            .main-layout .dashboard-card .stats-grid { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr))}
            .modern-header { flex-direction: column; text-align: center; }
            .modal-large { width: 95%; }
            .user-area { justify-content: center; }
            .logo-area { flex-direction: column; }
        }
        
        @media print {
            body *:not(#print-report-container):not(#print-report-container *) { visibility: hidden !important; }
            #print-report-container, #print-report-container * { visibility: visible !important; }
            #print-report-container { position: absolute !important; top: 0; left: 0; width: 100%; height: auto; background: white; padding: 10px; margin: 0; z-index: 99999; overflow: visible; page-break-after: avoid; page-break-inside: avoid; }
            table { width: 100%; border-collapse: collapse; font-size: 10px; page-break-inside: avoid; }
            th, td { border: 1px solid #ccc; padding: 4px; text-align: left; }
            .no-print { display: none !important; }
            tr, tbody, thead { page-break-inside: avoid; break-inside: avoid; }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading"><div class="spinner"></div></div>

    <div class="container" id="mainContainer">
       <div class="modern-header no-print">
            <div class="logo-area">
                <img src="https://raw.githubusercontent.com/phmca/dashboard-medicoes/main/logo-assessor.png" alt="Logo ASSESSOR / CONSÓRCIO-CE">
                <div style="flex:1; text-align:center;">
                    <h1 style="margin:0;">Registro de Atividades</h1>
                </div>
            </div>
            <div class="user-area" id="userInfo"></div>
        </div>

        <div class="main-layout no-print">
            <div class="form-card">
                <div class="card-title"><i class="fas fa-plus-circle"></i><span>Registrar Atividade</span></div>
                <form id="activityForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="required">Mês do Relatório:</label>
                            <select id="mesRelatorio" required>
                                <option value="Janeiro">Janeiro</option>
                                <option value="Fevereiro">Fevereiro</option>
                                <option value="Março">Março</option>
                                <option value="Abril">Abril</option>
                                <option value="Maio">Maio</option>
                                <option value="Junho">Junho</option>
                                <option value="Julho">Julho</option>
                                <option value="Agosto">Agosto</option>
                                <option value="Setembro">Setembro</option>
                                <option value="Outubro">Outubro</option>
                                <option value="Novembro">Novembro</option>
                                <option value="Dezembro">Dezembro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="required">Ano do Relatório:</label>
                            <select id="anoRelatorio" required>
                                <option value="2026">2026</option>
                                <option value="2027">2027</option>
                                <option value="2028">2028</option>
                                <option value="2029">2029</option>
                                <option value="2030">2030</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="required">Produto:</label>
                            <select id="produto" required>
                                <option value="">Selecione...</option>
                                <option value="Produto 1">Produto 1</option>
                                <option value="Produto 2">Produto 2</option>
                                <option value="Produto 3">Produto 3</option>
                                <option value="Produto 4 - Sobral">Produto 4 - Sobral</option>
                                <option value="Produto 4 - Fortaleza">Produto 4 - Fortaleza</option>
                                <option value="Produto 4 - Icó">Produto 4 - Icó</option>
                                <option value="Produto 4 - Boa Viagem">Produto 4 - Boa Viagem</option>
                                <option value="Produto 4 - Russas">Produto 4 - Russas</option>
                                <option value="Produto 5">Produto 5</option>
                                <option value="Produto 6">Produto 6</option>
                                <option value="Produto 7">Produto 7</option>
                                <option value="Produto 8">Produto 8</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Processo/SEI:</label>
                            <input type="text" id="processo" placeholder="_____/______/____-__" maxlength="21">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="required">Título:</label>
                            <input type="text" id="tipoAtividade" required>
                        </div>
                    </div>
                    <div class="form-group"><label class="required">Atividade/Descrição:</label><textarea id="descricao" required rows="3" placeholder="Descreva a atividade realizada..."></textarea></div>
                    <div class="form-row">
                        <div class="form-group"><label class="required">Status:</label>
                            <select id="status" required>
                                <option value="">Selecione...</option>
                                <option value="Concluída">Concluída</option>
                                <option value="Em andamento">Em andamento</option>
                                <option value="Em análise">Em análise</option>
                            </select>
                        </div>
                        <div class="form-group"><label class="required">Prioridade:</label>
                            <select id="prioridade">
                                <option value="Baixa">Baixa</option>
                                <option value="Média">Média</option>
                                <option value="Alta">Alta</option>
                                <option value="Urgente">Urgente</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="required">Data Solicitação:</label>
                            <input type="date" id="dataSolicitacao" required onchange="calcularPrazoTotal()">
                        </div>
                        <div class="form-group">
                            <label class="required">Data Limite:</label>
                            <input type="date" id="dataLimite" required onchange="calcularPrazoTotal()">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Data de Entrega:</label>
                            <input type="date" id="dataEntrega" onchange="calcularPrazoTotal()">
                        </div>
                        <div class="form-group">
                            <label>Prazo Total (dias):</label>
                            <input type="text" id="prazoTotal" readonly style="background:#f0f0f0; font-weight:bold; color:#667eea;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="required">Área Demandante:</label>
                        <select id="areaDemandante" required>
                            <option value="">Selecione uma área...</option>
                            <option value="SRE – Superintendência">SRE – Superintendência</option>
                            <option value="NAA – Núcleo de Apoio Administrativo">NAA – Núcleo de Apoio Administrativo</option>
                            <option value="COENGE – Coordenação de Engenharia">COENGE – Coordenação de Engenharia</option>
                            <option value="NAMCO – Núcleo de Apoio às Medições e aos Contratos de Obras e Serviços de Engenharia">NAMCO – Núcleo de Apoio às Medições e aos Contratos de Obras e Serviços de Engenharia</option>
                            <option value="NUCOM – Núcleo de Comunicação Social">NUCOM – Núcleo de Comunicação Social</option>
                            <option value="CAF – Coordenação de Administração e Finanças">CAF – Coordenação de Administração e Finanças</option>
                            <option value="SECONF – Serviço de Contabilidade e Finanças">SECONF – Serviço de Contabilidade e Finanças</option>
                            <option value="SELOG – Serviço de Recursos de Logística e Informática">SELOG – Serviço de Recursos de Logística e Informática</option>
                            <option value="SEPLAN – Serviço de Planejamento e Projetos">SEPLAN – Serviço de Planejamento e Projetos</option>
                            <option value="SMT – Serviço de Manutenção Terrestre">SMT – Serviço de Manutenção Terrestre</option>
                            <option value="SOT – Serviço de Operações Terrestres">SOT – Serviço de Operações Terrestres</option>
                            <option value="SCT – Serviço de Construção Terrestre">SCT – Serviço de Construção Terrestre</option>
                            <option value="SEMAB – Serviço de Desapropriação, Reassentamento e Meio Ambiente">SEMAB – Serviço de Desapropriação, Reassentamento e Meio Ambiente</option>
                            <option value="UFFOR – Unidade Ferroviária">UFFOR – Unidade Ferroviária</option>
                            <option value="SELIC – Serviço de Cadastro e Licitação">SELIC – Serviço de Cadastro e Licitação</option>
                            <option value="UL – Fortaleza">UL – Fortaleza</option>
                            <option value="UL – Russas">UL – Russas</option>
                            <option value="UL – Sobral">UL – Sobral</option>
                            <option value="UL – Icó">UL – Icó</option>
                            <option value="UL – Boa Viagem">UL – Boa Viagem</option>
                            <option value="ASSESSOR CE (Demanda Interna)">ASSESSOR CE (Demanda Interna)</option>
                        </select>
                    </div>
                    
                    <div class="form-group"><label>Observações:</label><textarea id="observacoes" rows="2" placeholder="Informações adicionais..."></textarea></div>
                    <div class="btn-group"><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar Atividade</button><button type="button" class="btn btn-outline" onclick="limparFormulario()"><i class="fas fa-eraser"></i> Limpar</button></div>
                </form>
            </div>

            <!-- Dashboard ao lado do formulário - compacto e alinhado com o topo -->
            <div class="form-card dashboard-card">
                <div class="card-title"><i class="fas fa-chart-line"></i><span>Dashboard</span></div>
                <div class="stats-grid" id="statsContainer"></div>
                <button onclick="gerarPDF()" class="btn btn-secondary"><i class="fas fa-file-pdf"></i> Gerar Relatório PDF</button>

function ordenarAtividadesTabela(coluna, direcao) {

        let valor = '';
        
        switch(coluna) {
            case 'dataSolicitacao':

                valor = tds[10] ? tds[10].textContent.trim() : '';

            default:

        let valorComparavel = valor;
        if (coluna === 'dataSolicitacao' || coluna === 'dataLimite' || coluna === 'dataEntrega') {
            if (valor && valor !== '-') {
                const partes = valor.split('/');

            valorComparavel = isNaN(num) ? 0 : num;

        return { linha, valor: valorComparavel, valorOriginal: valor };
    });

        function calcularDiferencaDias(dataInicio, dataFim) {
            if (!dataInicio || !dataFim) return null;
            try {
                const inicio = new Date(dataInicio);
                inicio.setHours(0, 0, 0, 0);
                const fim = new Date(dataFim);
                fim.setHours(0, 0, 0, 0);
                
                if (isNaN(inicio) || isNaN(fim)) return null;
                
                const diffTime = fim.getTime() - inicio.getTime();
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays;
            } catch (e) {
                return null;
            }
        }

        function formatarDataISO(dataStr) {
            if (!dataStr || dataStr.trim() === '') return null;
            dataStr = dataStr.trim().replace(/^"|"$/g, '');
            if (/^\d{4}-\d{2}-\d{2}$/.test(dataStr)) {
                return dataStr;
            }
            let data = new Date(dataStr);
            if (isNaN(data)) {
                const partes = dataStr.split('/');
                if (partes.length === 3) {
                    const dia = parseInt(partes[0]);
                    const mes = parseInt(partes[1]) - 1;
                    const ano = parseInt(partes[2]);
                    if (!isNaN(dia) && !isNaN(mes) && !isNaN(ano)) {
                        data = new Date(ano, mes, dia);
                    }
                }
            }
            if (isNaN(data)) {
                const partes = dataStr.split('-');
                if (partes.length === 3) {
                    const dia = parseInt(partes[0]);
                    const mes = parseInt(partes[1]) - 1;
                    const ano = parseInt(partes[2]);
                    if (!isNaN(dia) && !isNaN(mes) && !isNaN(ano)) {
                        data = new Date(ano, mes, dia);
                    }
                }
            }
            if (!isNaN(data)) {
                const ano = data.getFullYear();
                const mes = String(data.getMonth() + 1).padStart(2, '0');
                const dia = String(data.getDate()).padStart(2, '0');
                return `${ano}-${mes}-${dia}`;
            }
            return null;
        }

        function padronizarProduto(produto, areaDemandante) {
            if (!produto || produto.trim() === '') return 'Produto 1';
            const v = produto.trim().toUpperCase();
            const isProduto4 = v.match(/PRODUTO\s*0?4/i);
            if (isProduto4) {
                const areaParaCidade = {
                    'UL – Sobral': 'Sobral',
                    'UL – Fortaleza': 'Fortaleza',
                    'UL – Russas': 'Russas',
                    'UL – Icó': 'Icó',
                    'UL – Boa Viagem': 'Boa Viagem'
                };
                let cidadeEncontrada = null;
                if (areaDemandante) {
                    for (const [area, cidade] of Object.entries(areaParaCidade)) {
                        if (areaDemandante.includes(area) || areaDemandante.includes(cidade)) {
                            cidadeEncontrada = cidade;
                            break;
                        }
                    }
                    if (!cidadeEncontrada) {
                        for (const [area, cidade] of Object.entries(areaParaCidade)) {
                            if (areaDemandante.toUpperCase().includes(cidade.toUpperCase())) {
                                cidadeEncontrada = cidade;
                                break;
                            }
                        }
                    }
                }
                if (!cidadeEncontrada) {
                    const cidades = ['Sobral', 'Fortaleza', 'Russas', 'Icó', 'Boa Viagem'];
                    for (const cidade of cidades) {
                        if (v.includes(cidade.toUpperCase())) {
                            cidadeEncontrada = cidade;
                            break;
                        }
                    }
                }
                if (cidadeEncontrada) {
                    return `Produto 4 - ${cidadeEncontrada}`;
                }
                return 'Produto 4';
            }
            const match = v.match(/PRODUTO\s*0?(\d+)/i);
            if (match) {
                const num = parseInt(match[1]);
                return `Produto ${num}`;
            }
            return produto;
        }

        function parseDataLocal(dataISO) {
            if (!dataISO) return null;
            const match = String(dataISO).match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (match) {
                const [, ano, mes, dia] = match;
                const restoHorario = String(dataISO).slice(10);
                const horaMatch = restoHorario.match(/^T(\d{2}):(\d{2})(?::(\d{2}))?/);
                if (horaMatch) {
                    const [, h, m, s] = horaMatch;
                    return new Date(Number(ano), Number(mes) - 1, Number(dia), Number(h), Number(m), Number(s || 0));
                }
                return new Date(Number(ano), Number(mes) - 1, Number(dia));
            }
            return new Date(dataISO);
        }

        function formatarDataHora(dataISO) {
            if (!dataISO) return '-';
            const data = parseDataLocal(dataISO);
            if (!data || isNaN(data)) return '-';
            return data.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function formatarData(dataISO) {
            if (!dataISO) return '-';
            const data = parseDataLocal(dataISO);
            if (!data || isNaN(data)) return '-';
            return data.toLocaleDateString('pt-BR');
        }

        function gerarUsername(nomeCompleto) {
            if (!nomeCompleto) return 'sistema';
            const partes = nomeCompleto.trim().split(' ');
            const primeiroNome = partes[0] || 'usuario';
            const ultimoNome = partes[partes.length - 1] || '';
            let username = `${primeiroNome.toLowerCase()}_${ultimoNome.toLowerCase()}`;
            username = username.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            username = username.replace(/[^a-z_]/g, '');
            return username || 'sistema';
        }

            const syncStatus = document.getElementById('syncStatus');

            if (dot) {
                dot.className = 'status-dot';

            switch(status) {
                case 'online': texto = '✅ Sincronizado'; break;
                case 'offline': texto = '⚠️ Offline (dados locais)'; break;
                case 'syncing': texto = '⏳ Sincronizando...'; break;
                default: texto = mensagem || 'Sincronizado';

        async function salvarNoFirebase(dados) {
            try {
                sincronizando = true;
                atualizarStatusSincronizacao('syncing', 'Sincronizando...');
                await database.ref('sistema').set(dados);
                atualizarStatusSincronizacao('online', 'Sincronizado');
                return true;
            } catch (error) {
                console.error('Erro ao salvar no Firebase:', error);
                atualizarStatusSincronizacao('offline', 'Erro ao sincronizar');
                return false;
            } finally {
                sincronizando = false;
            }
        }

        async function carregarDoFirebase() {
            try {
                atualizarStatusSincronizacao('syncing', 'Carregando...');
                const snapshot = await database.ref('sistema').once('value');
                const dados = snapshot.val();
                if (dados) {
                    const usuariosCarregados = dados.usuarios || {};
                    usuarios = Object.fromEntries(Object.entries(usuariosCarregados).map(([login, user]) => [
                        login,
                        { ...user, cpf: user.cpf ? atob(user.cpf) : '' }
                    ]));
                    atividades = dados.atividades || [];
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
                    atualizarStatusSincronizacao('online', 'Sincronizado');
                    return true;
                }
                return false;
            } catch (error) {
                console.error('Erro ao carregar do Firebase:', error);
                atualizarStatusSincronizacao('offline', 'Usando dados locais');
                return false;
            }
        }

                    ])
                )
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dadosParaSalvar));
            await salvarNoFirebase(dadosParaSalvar);
        }

                    ]));

            }

        }

        window.excluirMultiplas = async function () {
            if (usuarioAtual.login !== 'dev1' && usuarioAtual.tipo !== 'chefe') {
                alert('❌ Apenas o desenvolvedor (dev1) e o gestor podem excluir atividades!');
                return;
            }
            const ids = [...document.querySelectorAll('.selecionar-item:checked')].map(cb => String(cb.value));
            if (ids.length === 0) {
                alert('Nenhuma atividade selecionada!');
                return;
            }
            let lista = '';
            ids.forEach(id => {
                const atv = atividades.find(a => String(a.id) === id);
                if (atv) {
                    lista += `\n• ${atv.produto} - ${atv.descricao.substring(0,40)}...`;
                }
            });
            if (!confirm(`⚠️ Tem certeza que deseja excluir ${ids.length} atividade(s)?\n\n${lista}\n\nEsta ação não pode ser desfeita!`)) {
                return;
            }
            atividades = atividades.filter(a => !ids.includes(String(a.id)));
            try {
                await salvarDados();
                alert(`🗑️ ${ids.length} atividade(s) excluída(s) com sucesso!`);
                gerarRelatorioAtual();
                if (usuarioAtual.tipo === 'chefe') { criarFiltros(); }
                document.getElementById('contSelecionados').textContent = '0';
                document.getElementById('btnExcluirMultiplas').style.display = 'none';
                document.getElementById('selecionarTodos').checked = false;
            } catch (erro) {
                console.error(erro);
                alert("Erro ao salvar os dados.");
            }
        };

        window.recarregarDados = async function() {
            if (!confirm('Deseja recarregar os dados do Firebase? Isso irá buscar a versão mais recente.')) return;
            try {
                const snapshot = await database.ref('sistema').once('value');
                const dados = snapshot.val();
                if (dados) {
                    const usuariosCarregados = dados.usuarios || {};
                    usuarios = Object.fromEntries(Object.entries(usuariosCarregados).map(([login, user]) => [
                        login, { ...user, cpf: user.cpf ? atob(user.cpf) : '' }
                    ]));
                    atividades = dados.atividades || [];
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
                    alert('✅ Dados recarregados com sucesso!');
                    gerarRelatorioAtual();
                    if (usuarioAtual.tipo === 'chefe') criarFiltros();
                } else {
                    alert('❌ Nenhum dado encontrado no Firebase.');
                }
            } catch (error) {
                alert('❌ Erro ao recarregar dados: ' + error.message);
            }
        };

        window.efetuarLogin = function() {
            const login = document.getElementById('userLogin').value.toLowerCase();
            const senha = document.getElementById('userSenha').value;
            if (usuarios[login] && usuarios[login].senha === senha) {
                document.getElementById('loginScreen').remove();

                    usuarioAtual = { login: login, ...usuarios[login] };

                    return;
                }

                    mostrarModalTrocaSenha(login, true);

                usuarioAtual = { login: login, ...usuarios[login] };
                carregarInterface();

                document.getElementById('loginMsg').innerText = 'Usuário ou senha inválidos';
            }

        window.executarTrocaSenha = async function(username, isPrimeiroAcesso) {
            const novaSenha = document.getElementById('novaSenha').value;
            const confirmaSenha = document.getElementById('confirmaSenha').value;
            const errorDiv = document.getElementById('pwdError');
            if (!isPrimeiroAcesso) {
                const senhaAtual = document.getElementById('senhaAtual').value;
                if (usuarios[username].senha !== senhaAtual) {
                    errorDiv.innerText = 'Senha atual incorreta';
                    return;
                }
            }
            if (novaSenha.length < 6) { errorDiv.innerText = 'Mínimo 6 caracteres'; return; }
            if (novaSenha !== confirmaSenha) { errorDiv.innerText = 'Senhas não conferem'; return; }
            usuarios[username].senha = novaSenha;
            usuarios[username].primeiroAcesso = false;
            const dadosParaSalvar = {
                atividades: atividades,
                usuarios: Object.fromEntries(Object.entries(usuarios).map(([login, user]) => [
                    login, { ...user, cpf: user.cpf ? btoa(user.cpf) : '' }
                ]))
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dadosParaSalvar));
            try {
                await database.ref('sistema').set(dadosParaSalvar);
                alert('✅ Senha alterada e sincronizada com a nuvem!');
            } catch (error) {
                alert('⚠️ Senha alterada localmente, mas houve erro na sincronização. Tente novamente.');
                console.error('Erro ao sincronizar:', error);
            }
            document.querySelector('.modal').remove();
            if (isPrimeiroAcesso) {
                usuarioAtual = { login: username, ...usuarios[username] };
                carregarInterface();
            }
        };

        };

        function carregarListaEngenheiros() {
            const tbody = document.getElementById('listaEngenheiros');
            if (!tbody) return;
            tbody.innerHTML = '';
            let temEngenheiros = false;
            Object.keys(usuarios).forEach(login => {
                const user = usuarios[login];
                if (user.tipo === 'engenheiro') {
                    temEngenheiros = true;
                    const qtdAtividades = atividades.filter(a => a.loginsEng && a.loginsEng.includes(login)).length;
                    let historicoHtml = '-';
                    if (user.historicoLogins && user.historicoLogins.length > 0) {
                        historicoHtml = '<div style="font-size:11px;">';
                        user.historicoLogins.forEach(h => {
                            historicoHtml += `<div>🔑 ${h.login} <small>(${formatarDataHora(h.data)})</small></div>`;
                        });
                        historicoHtml += '</div>';
                    }
                    const cpfExibido = user.cpf ? maskCPF(user.cpf) : '-';
                    const isProtegido = (login === 'dev1' || login === LOGIN_GESTOR);
                    const row = tbody.insertRow();
                    row.innerHTML = `
                        <td>${!isProtegido ? `<input type="checkbox" class="selecionar-engenheiro" value="${login}" onchange="atualizarContadorEngenheiros()">` : '-'}</td>
                        <td>${login}${isProtegido ? ' <span style="color:#f59e0b;font-size:10px;">🔒</span>' : ''}</td>
                        <td>${user.nome}</td>
                        <td><span class="cpf-mask">${cpfExibido}</span></td>
                        <td style="text-align:center;">${qtdAtividades}</td>
                        <td>${historicoHtml}</td>
                        <td>
                            <button class="btn btn-warning btn-small" onclick="editarEngenheiro('${login}')"><i class="fas fa-edit"></i></button>
                            ${!isProtegido ? `<button class="btn btn-danger btn-small" onclick="removerEngenheiro('${login}')"><i class="fas fa-trash"></i></button>` : '-'}
                        </td>
                    `;
                }
            });
            if (!temEngenheiros) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px; color:#888;">Nenhum engenheiro cadastrado</td></tr>';
            }
            atualizarContadorEngenheiros();
        }

        function atualizarContadorEngenheiros() {
            const checkboxes = document.querySelectorAll('.selecionar-engenheiro:checked');
            const count = checkboxes.length;
            const cont = document.getElementById('contEngSelecionados');
            const btn = document.getElementById('btnExcluirEngenheiros');
            if (cont) cont.textContent = count;
            if (btn) { btn.style.display = count > 0 ? 'inline-flex' : 'none'; }
        }

        function selecionarTodosEngenheiros(selecionar) {
            const checkboxes = document.querySelectorAll('.selecionar-engenheiro');
            checkboxes.forEach(cb => { cb.checked = selecionar; });
            atualizarContadorEngenheiros();
        }

        function excluirEngenheirosSelecionados() {
            const checkboxes = document.querySelectorAll('.selecionar-engenheiro:checked');
            const logins = [];
            checkboxes.forEach(cb => {
                const login = cb.value;
                const user = usuarios[login];
                if (user) { logins.push(login); }
            });
            if (logins.length === 0) {
                alert('Nenhum engenheiro selecionado!');
                return;
            }
            const temProtegido = logins.some(login => login === 'dev1' || login === LOGIN_GESTOR);
            if (temProtegido) {
                alert('❌ Não é possível excluir o desenvolvedor (dev1) ou o gestor principal!');
                return;
            }
            let lista = logins.map(login => {
                const user = usuarios[login];
                const qtd = atividades.filter(a => a.loginsEng && a.loginsEng.includes(login)).length;
                return `• ${user.nome} (${login}) - ${qtd} atividade(s)`;
            }).join('\n');
            if (!confirm(`⚠️ Tem certeza que deseja excluir ${logins.length} engenheiro(s)?\n\n${lista}\n\n📌 As atividades NÃO serão excluídas, apenas ficarão sem engenheiro associado.\n📌 Os engenheiros não poderão mais acessar o sistema.\n\nEsta ação não pode ser desfeita!`)) {
                return;
            }
            let totalAtividades = 0;
            logins.forEach(login => {
                const qtdAtividades = atividades.filter(a => a.loginsEng && a.loginsEng.includes(login)).length;
                totalAtividades += qtdAtividades;
                delete usuarios[login];
                atividades = atividades.map(a => {
                    if (a.loginsEng && a.loginsEng.includes(login)) {
                        const novosLogins = a.loginsEng.filter(l => l !== login);
                        const novosNomes = a.engenheirosLista ? a.engenheirosLista.filter((_, i) => a.loginsEng[i] !== login) : [];
                        return {
                            ...a,
                            loginsEng: novosLogins,
                            engenheirosLista: novosNomes,
                            engenheiro: novosNomes.join(', '),
                            loginEng: novosLogins[0] || 'sistema'
                        };
                    }
                    return a;
                });
            });
            salvarDados();
            alert(`✅ ${logins.length} engenheiro(s) removido(s) com sucesso!\n📊 ${totalAtividades} atividade(s) permanecem no sistema.`);
            carregarListaEngenheiros();
            if (usuarioAtual.tipo === 'chefe') criarFiltros();
            gerarRelatorioAtual();
        }

        window.removerEngenheiro = function(login) {
            if (usuarioAtual.login !== 'dev1' && usuarioAtual.tipo !== 'chefe') {
                alert('❌ Apenas o desenvolvedor (dev1) e o gestor podem remover engenheiros!');
                return;
            }
            if (login === usuarioAtual.login) {
                alert('❌ Você não pode remover a si mesmo!');
                return;
            }
            if (login === 'dev1' || login === LOGIN_GESTOR) {
                alert('❌ Não é possível remover o desenvolvedor ou o gestor principal!');
                return;
            }
            const engenheiro = usuarios[login];
            if (!engenheiro) {
                alert('❌ Engenheiro não encontrado!');
                return;
            }
            if (engenheiro.tipo !== 'engenheiro') {
                alert('❌ Este usuário não é um engenheiro!');
                return;
            }
            const qtdAtividades = atividades.filter(a => a.loginsEng && a.loginsEng.includes(login)).length;
            let mensagem = `⚠️ Tem certeza que deseja remover o engenheiro "${engenheiro.nome}" (${login})?`;
            mensagem += `\n\n📌 Este engenheiro possui ${qtdAtividades} atividade(s) no sistema.`;
            mensagem += `\n📌 As atividades NÃO serão excluídas, apenas ficarão sem um engenheiro associado.`;
            mensagem += `\n📌 O engenheiro não poderá mais acessar o sistema.`;
            mensagem += `\n\nEsta ação não pode ser desfeita!`;
            if (confirm(mensagem)) {
                delete usuarios[login];
                atividades = atividades.map(a => {
                    if (a.loginsEng && a.loginsEng.includes(login)) {
                        const novosLogins = a.loginsEng.filter(l => l !== login);
                        const novosNomes = a.engenheirosLista ? a.engenheirosLista.filter((_, i) => a.loginsEng[i] !== login) : [];
                        return {
                            ...a,
                            loginsEng: novosLogins,
                            engenheirosLista: novosNomes,
                            engenheiro: novosNomes.join(', '),
                            loginEng: novosLogins[0] || 'sistema'
                        };
                    }
                    return a;
                });
                salvarDados();
                alert(`✅ Engenheiro "${engenheiro.nome}" removido com sucesso!\n📊 ${qtdAtividades} atividade(s) permanecem no sistema.`);
                carregarListaEngenheiros();
                if (usuarioAtual.tipo === 'chefe') criarFiltros();
                gerarRelatorioAtual();
            }
        };

        window.editarEngenheiro = function(login) {
            if (usuarioAtual.login !== 'dev1' && usuarioAtual.tipo !== 'chefe') {
                alert('❌ Apenas o desenvolvedor (dev1) e o gestor podem editar engenheiros!');
                return;
            }
            const user = usuarios[login];
            if (!user) return;
            if (login === 'dev1' && usuarioAtual.login !== 'dev1') {
                alert('❌ Apenas o desenvolvedor pode editar o próprio dev1!');
                return;
            }
            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal';
            modalDiv.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <button class="modal-close" onclick="this.closest('.modal').remove()">✕</button>
                        <h2>✏️ Editar Engenheiro</h2>
                    </div>
                    <div class="modal-body">
                        <div class="form-group"><label>Login:</label><input type="text" value="${login}" disabled style="background:#f0f0f0;"></div>
                        <div class="form-group"><label>Nome:</label><input type="text" id="editNomeEng" value="${user.nome}"></div>
                        <div class="form-group"><label>CPF:</label><input type="text" id="editCpfEng" value="${user.cpf || ''}" maxlength="11"></div>
                        <div id="editEngError" class="error" style="color:red; margin-top:10px;"></div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-outline" onclick="this.closest('.modal').remove()">Cancelar</button>
                        <button class="btn btn-primary" onclick="salvarEdicaoEngenheiro('${login}')">Salvar</button>

        window.salvarEdicaoEngenheiro = function(login) {
            const novoNome = document.getElementById('editNomeEng').value.trim();
            const novoCpf = document.getElementById('editCpfEng').value.trim();
            const errorDiv = document.getElementById('editEngError');
            if (!novoNome) { errorDiv.innerText = 'Nome não pode ficar vazio!'; return; }
            if (!novoCpf || novoCpf.length !== 11 || !/^\d+$/.test(novoCpf)) {
                errorDiv.innerText = 'CPF inválido! Digite exatamente 11 dígitos numéricos.';
                return;
            }
            const novoUsername = gerarUsername(novoNome);
            if (novoUsername !== login && usuarios[novoUsername]) {
                errorDiv.innerText = `Usuário "${novoUsername}" já existe!`;
                return;
            }
            const novaSenha = gerarSenhaInicial(novoCpf);
            const dataAtual = new Date().toISOString();
            if (novoUsername !== login) {
                const historicoAtual = usuarios[login].historicoLogins || [];
                historicoAtual.push({ login: novoUsername, data: dataAtual });
                usuarios[novoUsername] = { ...usuarios[login], nome: novoNome, cpf: novoCpf, senha: novaSenha, primeiroAcesso: true, historicoLogins: historicoAtual };
                delete usuarios[login];
                atividades = atividades.map(a => {
                    if (a.loginsEng && a.loginsEng.includes(login)) {
                        const novosLogins = a.loginsEng.map(l => l === login ? novoUsername : l);

                    try {
                        const conteudo = event.target.result;
                        const linhas = [];

                        let dentroAspas = false;
                        let texto = conteudo;
                        if (texto.charCodeAt(0) === 0xFEFF) { texto = texto.substring(1); }
                        for (let i = 0; i < texto.length; i++) {
                            const char = texto[i];
                            if (char === '"') {
                                if (dentroAspas && texto[i + 1] === '"') {
                                    campoAtual += '"';
                                    i++;
                                } else {
                                    dentroAspas = !dentroAspas;

                            } else if ((char === ',' || char === ';') && !dentroAspas) {
                                linhaAtual.push(campoAtual.trim());

                                linhaAtual.push(campoAtual.trim());
                                if (linhaAtual.some(campo => campo !== '')) {
                                    linhas.push(linhaAtual);
                                }

                                campoAtual += char;

                        const mapearStatus = (valor) => {

                            if (v.includes('andamento') || v === 'em andamento') return 'Em andamento';
                            if (v.includes('análise') || v.includes('em analise')) return 'Em análise';

                      dadosLinhas.forEach((valores, index) => {

        const dataLimite = formatarDataISO(getValor(valoresLimpos, POS.dataLimite));
        const prioridade = mapearPrioridade(getValor(valoresLimpos, POS.prioridade));
        
        const dataEntregaRaw = getValor(valoresLimpos, POS.dataEntrega);

            status = 'Concluída';

        // 🔥 CALCULA O PRAZO TOTAL (SEMPRE NÚMERO, NUNCA TEXTO)

            prazoTotal = diffDays !== null ? (diffDays >= 0 ? diffDays : 0) : 0;

            const diffDays = calcularDiferencaDias(dataSolicitacao, dataLimite);

        else if (dataEntrega && dataLimite) {

            criado: dataCriado,
            criadoPor: criadoPor || null,
            ultimaModificacao: dataCriado,
            ultimoEditor: criadoPor || null
        };
        
        atividades.push(novaAtividade);
        importados++;
        
    } catch (err) {
        erros++;
        errosDetalhes.push(`Linha ${index + 2}: ${err.message}`);
        console.error('Erro ao importar linha', index, err);

                    'Alta': 'background:#fef3c7; color:#d97706;',
                    'Média': 'background:#dbeafe; color:#2563eb;',
                    'Baixa': 'background:#f3f4f6; color:#6b7280;'
                };
                const prioridadeColor = prioridadeColors[act.prioridade] || prioridadeColors['Média'];
                
                row.innerHTML = `
                    <td>${podeExcluir ? `<input type="checkbox" class="selecionar-item" value="${act.id}" onchange="toggleSelecionar(${act.id})">` : ''}</td>
                    <td>${act.processo || '-'}</td>
                    <td><strong>${act.produto}</strong></td>
                    <td>${act.tipoAtividade || '-'}</td>
                    <td class="descricao-cell" onclick="verDescricaoCompleta('${act.id}')" title="Clique para ver a descrição completa">${descTruncada}</td>
                    <td style="color:${statusColor}; font-weight:bold;">${act.status}</td>
                    <td>${act.areaDemandante || '-'}</td>
                    <td>${formatarData(act.dataSolicitacao)}</td>
                    <td>${formatarData(act.dataLimite)}</td>
                    <td>${act.dataEntrega ? formatarData(act.dataEntrega) : '-'}</td>
                    <td style="color:${prazoColor}; font-weight:bold; text-align:center;">${prazoTotal}</td>
                    <td style="font-size:10px; max-width:180px;">${ultimaModif}</td>
                    <td>
                        <span style="display:inline-block; padding:2px 10px; border-radius:12px; font-size:0.7rem; font-weight:600; ${prioridadeColor}">
                            ${act.prioridade || 'Média'}
                        </span>
                    </td>
                    <td>${nomeEngenheiro}</td>
                    <td class="no-print">
                        ${usuarioAtual.tipo === 'chefe' || (act.loginsEng && act.loginsEng.includes(usuarioAtual.login)) ? `<button class="btn btn-warning btn-small" onclick="window.editarAtividade(${act.id})">✏️</button>` : '-'}
                        ${podeExcluir ? `<button class="btn btn-danger btn-small" onclick="window.excluirAtividade(${act.id})" title="Excluir atividade">🗑️</button>` : ''}
                    </td>
                `;
            });
            
            atualizarContadorSelecionados();
            restaurarPosicaoScroll();
        }

        window.excluirAtividade = function(id) {
            if (usuarioAtual.login !== 'dev1' && usuarioAtual.tipo !== 'chefe') {
                alert('❌ Apenas o desenvolvedor (dev1) e o gestor podem excluir atividades!');
                return;
            }
            const atividade = atividades.find(a => a.id === id);
            if (!atividade) return;
            if (confirm(`⚠️ Tem certeza que deseja excluir esta atividade?\n\n"${atividade.descricao.substring(0, 50)}..."\n\nEsta ação não pode ser desfeita!`)) {
                atividades = atividades.filter(a => a.id !== id);
                salvarDados();
                alert('🗑️ Atividade excluída com sucesso!');
                gerarRelatorioAtual();
                if (usuarioAtual.tipo === 'chefe') criarFiltros();
                document.getElementById('contSelecionados').textContent = '0';
                document.getElementById('btnExcluirMultiplas').style.display = 'none';
                document.getElementById('selecionarTodos').checked = false;
            }
        };

        window.editarAtividade = function(id) {
            const atividade = atividades.find(a => a.id === id);
            if (!atividade) return;
            if (usuarioAtual.tipo !== 'chefe' && !(atividade.loginsEng && atividade.loginsEng.includes(usuarioAtual.login))) {
                alert('Você só pode editar suas próprias atividades!');
                return;
            }
            
            const mesesOptions = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'].map(m => `<option value="${m}" ${atividade.mes === m ? 'selected' : ''}>${m}</option>`).join('');
            const anosOptions = [2026,2027,2028,2029,2030].map(a => `<option value="${a}" ${atividade.ano == a ? 'selected' : ''}>${a}</option>`).join('');
            
            const produtosOptions = [
                'Produto 1','Produto 2','Produto 3',
                'Produto 4 - Sobral','Produto 4 - Fortaleza','Produto 4 - Icó',
                'Produto 4 - Boa Viagem','Produto 4 - Russas',
                'Produto 5','Produto 6','Produto 7','Produto 8'
            ].map(p => `<option value="${p}" ${atividade.produto === p ? 'selected' : ''}>${p}</option>`).join('');
            
            const statusOptions = ['Concluída','Em andamento','Em análise'].map(s => `<option value="${s}" ${atividade.status === s ? 'selected' : ''}>${s}</option>`).join('');
            const prioridadeOptions = ['Baixa','Média','Alta','Urgente'].map(p => `<option value="${p}" ${atividade.prioridade === p ? 'selected' : ''}>${p}</option>`).join('');
            
            const areasLista = ['SRE – Superintendência','NAA – Núcleo de Apoio Administrativo','COENGE – Coordenação de Engenharia','NAMCO – Núcleo de Apoio às Medições e aos Contratos de Obras e Serviços de Engenharia','NUCOM – Núcleo de Comunicação Social','CAF – Coordenação de Administração e Finanças','SECONF – Serviço de Contabilidade e Finanças','SELOG – Serviço de Recursos de Logística e Informática','SEPLAN – Serviço de Planejamento e Projetos','SMT – Serviço de Manutenção Terrestre','SOT – Serviço de Operações Terrestres','SCT – Serviço de Construção Terrestre','SEMAB – Serviço de Desapropriação, Reassentamento e Meio Ambiente','UFFOR – Unidade Ferroviária','SELIC – Serviço de Cadastro e Licitação','UL – Fortaleza','UL – Russas','UL – Sobral','UL – Icó','UL – Boa Viagem','ASSESSOR CE (Demanda Interna)'];
            const areasOptions = areasLista.map(a => `<option value="${a}" ${atividade.areaDemandante === a ? 'selected' : ''}>${a}</option>`).join('');
            
            let infoEdicao = '';
            if (atividade.ultimaModificacao) {
                const isDev = usuarioAtual && usuarioAtual.login === 'dev1';
                if (!isDev) {
                    infoEdicao = `<div class="form-group" style="margin-top: 15px; background: #f8f9fc; padding: 10px; border-radius: 8px;">
                        <label><i class="fas fa-edit"></i> Última edição:</label>
                        <div>✏️ ${formatarDataHora(atividade.ultimaModificacao)} por ${atividade.ultimoEditor || atividade.engenheiro}</div>
                    </div>`;
                }
            }
            
            const modalDiv = document.createElement('div');
            modalDiv.className = 'modal';
            modalDiv.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <button class="modal-close" onclick="this.closest('.modal').remove()">✕</button>
                        <h2>✏️ Editar Atividade</h2>
                    </div>
                    <div class="modal-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="required">Mês do Relatório:</label>
                                <select id="editMes" required>${mesesOptions}</select>
                            </div>
                            <div class="form-group">
                                <label class="required">Ano do Relatório:</label>
                                <select id="editAno" required>${anosOptions}</select>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="required">Produto:</label>
                                <select id="editProduto" required>${produtosOptions}</select>
                            </div>
                            <div class="form-group">
                                <label>Processo/SEI:</label>
                                <input type="text" id="editProcesso" value="${atividade.processo || ''}" maxlength="21">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="required">Título:</label>
                            <input type="text" id="editTipoAtividade" value="${atividade.tipoAtividade || ''}" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="required">Atividade/Descrição:</label>
                            <textarea id="editDescricao" rows="3" required>${atividade.descricao || ''}</textarea>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="required">Status:</label>
                                <select id="editStatus" required>${statusOptions}</select>
                            </div>
                            <div class="form-group">
                                <label>Prioridade:</label>
                                <select id="editPrioridade">${prioridadeOptions}</select>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label class="required">Data Solicitação:</label>
                                <input type="date" id="editDataSolicitacao" value="${atividade.dataSolicitacao || ''}" required onchange="calcularPrazoTotalEdicao()">
                            </div>
                            <div class="form-group">
                                <label class="required">Data Limite:</label>
                                <input type="date" id="editDataLimite" value="${atividade.dataLimite || ''}" required onchange="calcularPrazoTotalEdicao()">
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label>Data de Efetiva Entrega:</label>
                                <input type="date" id="editDataEntrega" value="${atividade.dataEntrega || ''}" onchange="calcularPrazoTotalEdicao()">
                            </div>
                            <div class="form-group">
                                <label>Prazo Total (dias):</label>
                                <input type="text" id="editPrazoTotal" readonly style="background:#f0f0f0; font-weight:bold; color:#667eea;" value="${atividade.prazoTotal || ''}">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="required">Área Demandante:</label>
                            <select id="editAreaDemandante" required>
                                <option value="">Selecione uma área...</option>
                                ${areasOptions}
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Observações:</label>
                            <textarea id="editObservacoes" rows="2">${atividade.observacoes || ''}</textarea>
                        </div>
                        
                        ${infoEdicao}
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-outline" onclick="this.closest('.modal').remove()">Cancelar</button>
                        <button class="btn btn-primary" onclick="salvarEdicao(${id})">Salvar</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modalDiv);
            
            const campoProcessoEdit = document.getElementById('editProcesso');
            if (campoProcessoEdit) {
                campoProcessoEdit.addEventListener('input', function() { aplicarMascaraProcesso(this); });
                campoProcessoEdit.addEventListener('blur', function() { if (this.value) validarProcesso(this.value); });
            }
            
            document.getElementById('editDataEntrega').addEventListener('change', calcularPrazoTotalEdicao);
            document.getElementById('editDataSolicitacao').addEventListener('change', calcularPrazoTotalEdicao);
            document.getElementById('editDataLimite').addEventListener('change', calcularPrazoTotalEdicao);
            document.getElementById('editStatus').addEventListener('change', calcularPrazoTotalEdicao);
            
            // 🔥 Quando o status mudar para "Concluída" no modal, preencher a data de entrega com o dia atual
            document.getElementById('editStatus').addEventListener('change', function() {
                if (this.value === 'Concluída') {
                    const dataEntrega = document.getElementById('editDataEntrega');
                    const hoje = new Date().toISOString().split('T')[0];
                    dataEntrega.value = hoje;
                    calcularPrazoTotalEdicao();
                }
            });
            
            setTimeout(calcularPrazoTotalEdicao, 100);
        };

        function calcularPrazoTotalEdicao() {
    const dataSolicitacao = document.getElementById('editDataSolicitacao')?.value;
    const dataLimite = document.getElementById('editDataLimite')?.value;
    const dataEntrega = document.getElementById('editDataEntrega')?.value;
    const status = document.getElementById('editStatus')?.value;
    const prazoTotalInput = document.getElementById('editPrazoTotal');
    
    if (!prazoTotalInput) return;
    
    // PRIORIDADE 1: Se está CONCLUÍDA, calcular diferença entre Data de Entrega e Data Limite
    if (status === 'Concluída' && dataEntrega && dataLimite) {
        const diffDays = calcularDiferencaDias(dataEntrega, dataLimite);
        if (diffDays !== null) {
            prazoTotalInput.value = diffDays >= 0 ? diffDays : 0;
            prazoTotalInput.style.color = diffDays >= 0 ? '#48bb78' : '#f56565';
            prazoTotalInput.style.background = diffDays >= 0 ? '#f0fff4' : '#fff5f5';
            return;
        }
    }
    
    // PRIORIDADE 2: Se está CONCLUÍDA mas não tem Data de Entrega, usar data atual
    if (status === 'Concluída' && !dataEntrega && dataLimite) {
        const hoje = new Date().toISOString().split('T')[0];
        const diffDays = calcularDiferencaDias(hoje, dataLimite);
        if (diffDays !== null) {
            prazoTotalInput.value = diffDays >= 0 ? diffDays : 0;
            prazoTotalInput.style.color = diffDays >= 0 ? '#48bb78' : '#f56565';
            prazoTotalInput.style.background = diffDays >= 0 ? '#f0fff4' : '#fff5f5';
            return;
        }
    }
    
    // PRIORIDADE 3: Se NÃO está CONCLUÍDA, calcular diferença entre Data Limite e Data Solicitação
    if (dataSolicitacao && dataLimite) {
        const diffDays = calcularDiferencaDias(dataSolicitacao, dataLimite);
        if (diffDays !== null) {
            prazoTotalInput.value = diffDays >= 0 ? diffDays : 0;
            prazoTotalInput.style.color = diffDays >= 0 ? '#667eea' : '#f56565';
            prazoTotalInput.style.background = diffDays >= 0 ? '#f0f0f0' : '#fff5f5';
            return;
        }
    }
    
    // PRIORIDADE 4: Tem Data de Entrega e Data Limite (mas não está Concluída)
    if (dataEntrega && dataLimite) {
        const diffDays = calcularDiferencaDias(dataEntrega, dataLimite);
        if (diffDays !== null) {
            prazoTotalInput.value = diffDays >= 0 ? diffDays : 0;
            prazoTotalInput.style.color = diffDays >= 0 ? '#48bb78' : '#f56565';
            prazoTotalInput.style.background = diffDays >= 0 ? '#f0fff4' : '#fff5f5';
            return;
        }
    }
    
    // PRIORIDADE 5: Tem Data Solicitação mas não tem Data Limite
    if (dataSolicitacao && !dataLimite) {
        prazoTotalInput.value = 0;
        prazoTotalInput.style.color = '#888';
        prazoTotalInput.style.background = '#f8f9fc';
        return;
    }
    
    prazoTotalInput.value = '';
    prazoTotalInput.style.color = '#667eea';
    prazoTotalInput.style.background = '#f0f0f0';
}
        window.salvarEdicao = function(id) {
            const index = atividades.findIndex(a => a.id === id);
            if (index !== -1) {
                calcularPrazoTotalEdicao();
                
                const novosValores = {
                    mes: document.getElementById('editMes').value,
                    ano: document.getElementById('editAno').value,
                    produto: document.getElementById('editProduto').value,
                    processo: document.getElementById('editProcesso').value || '',
                    tipoAtividade: document.getElementById('editTipoAtividade').value,
                    descricao: document.getElementById('editDescricao').value,
                    status: document.getElementById('editStatus').value,
                    prioridade: document.getElementById('editPrioridade').value,
                    dataSolicitacao: document.getElementById('editDataSolicitacao').value || '',
                    dataLimite: document.getElementById('editDataLimite').value || '',
                    dataEntrega: document.getElementById('editDataEntrega').value || '',
                    prazoTotal: document.getElementById('editPrazoTotal').value || '',
                    areaDemandante: document.getElementById('editAreaDemandante').value || '',
                    observacoes: document.getElementById('editObservacoes').value || ''
                };
                
                if (novosValores.processo && !validarProcesso(novosValores.processo)) return;
                if (!novosValores.produto || !novosValores.tipoAtividade || !novosValores.descricao || !novosValores.status || !novosValores.mes || !novosValores.ano || !novosValores.dataSolicitacao || !novosValores.dataLimite || !novosValores.areaDemandante) {
                    alert('Preencha todos os campos obrigatórios!');
                    return;
                }
                
                const dataAtual = new Date().toISOString();
                atividades[index] = {
                    ...atividades[index],
                    ...novosValores,
                    ultimaModificacao: dataAtual,
                    ultimoEditor: usuarioAtual.nome
                };
                
                salvarDados();
                alert(`✅ Atividade atualizada!`);
                document.querySelector('.modal').remove();
                gerarRelatorioAtual();
                if (usuarioAtual.tipo === 'chefe') criarFiltros();
            }
        };

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const modals = document.querySelectorAll('.modal');
                modals.forEach(modal => {
                    if (modal.style.display !== 'none') { modal.remove(); }
                });
            }
        });

        (async function() {
            const dadosExistentes = await carregarDados();
            if (!dadosExistentes || Object.keys(usuarios).length === 0) {
                criarDadosIniciais();
            }
            if (!usuarios[LOGIN_GESTOR]) {
                usuarios[LOGIN_GESTOR] = {
                    nome: 'Arnaldo Cunha',
                    tipo: 'chefe',
                    senha: getSenhaGestor(),
                    primeiroAcesso: true,
                    historicoLogins: [{ login: LOGIN_GESTOR, data: new Date().toISOString() }]
                };
                salvarDados();
            }
            if (!usuarios['dev1']) {
                usuarios['dev1'] = {
                    nome: 'Desenvolvedor',
                    tipo: 'chefe',
                    senha: 'dnit@321',
                    primeiroAcesso: false,
                    historicoLogins: [{ login: 'dev1', data: new Date().toISOString() }]
                };
                salvarDados();
            }
            mostrarLogin();
        })();
    </script>
</body>
</html>
